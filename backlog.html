<style id="backlog-style">
.backlog-root {
  --bg: #f3f4f6;
  --panel: #ffffff;
  --lane-bg: #e9ebef;
  --border: #dfe3e8;
  --text: #1f2937;
  --muted: #6b7280;
  --accent: #a100ff;
  --accent-soft: #efd9ff;
  --danger: #dc2626;
  --warn: #d97706;
  --ok: #059669;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  color-scheme: light dark;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
  font-size: 14px;
  line-height: 1.4;
  color: var(--text);
  background: var(--bg);
  text-align: left;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  height: var(--backlog-height, 80vh);
  min-height: 420px;
  overflow: hidden;
  border-radius: 6px;

  &[data-standalone] { height: 100vh; min-height: 0; border-radius: 0; }

  @media (prefers-color-scheme: dark) {
    & {
      --bg: #0f1216;
      --panel: #1a1f26;
      --lane-bg: #14181e;
      --border: #2a313b;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #b84dff;
      --accent-soft: #3b0764;
      --ok: #34d399;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }

  & *, & *::before, & *::after { box-sizing: border-box; }
  & button, & input, & select, & textarea { font: inherit; color: inherit; margin: 0; }
  & button { cursor: pointer; }
  & h1, & h2, & h3, & p, & ul { margin: 0; }
  & p { margin-bottom: 8px; }
  & input[type="text"], & input[type="search"], & input[type="date"], & input[type="number"], & select, & textarea {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 0;
  }
  & input:focus-visible, & select:focus-visible, & textarea:focus-visible, & button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    line-height: 1.3;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { border-color: var(--danger); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .icon-btn {
    background: transparent; border: 0; border-radius: 6px; padding: 2px 6px; color: var(--muted); line-height: 1;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }

  /* ---------- header ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand h1 { font-size: 16px; font-weight: 700; }
  .brand .logo { width: 26px; height: 26px; border-radius: 7px; background: #a100ff; color: #fff; display: grid; place-items: center; font-size: 14px; font-weight: 700; }
  .unsaved { display: none; font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 9px; background: transparent; cursor: pointer; }
  .unsaved:hover { background: var(--warn); color: #fff; }
  &.dirty .unsaved { display: inline-block; }
  .views { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; }
  .views button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; color: var(--muted); }
  .views button.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
  .filters { display: flex; gap: 6px; flex: 1 1 auto; flex-wrap: wrap; min-width: 200px; }
  .filters input[type="search"] { flex: 1 1 160px; }
  .filters select { max-width: 150px; }
  .actions { display: flex; gap: 6px; margin-left: auto; }

  /* ---------- main ---------- */
  .main { flex: 1 1 auto; overflow: auto; min-height: 0; }
  .empty { padding: 48px; text-align: center; color: var(--muted); }

  /* ---------- board ---------- */
  .board { display: flex; gap: 12px; padding: 16px; align-items: flex-start; min-height: 100%; }
  .lane {
    flex: 0 0 290px;
    background: var(--lane-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    max-height: 100%;
  }
  .lane.over .lane-count { color: var(--danger); font-weight: 700; }
  .lane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-top: 3px solid var(--lane);
    border-radius: var(--radius) var(--radius) 0 0;
    font-weight: 600;
  }
  .lane-count { color: var(--muted); font-weight: 400; font-size: 12px; }
  .lane-head .icon-btn { margin-left: auto; font-size: 16px; }
  .lane-body { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; overflow-y: auto; flex: 1 1 auto; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    cursor: grab;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px;
  }
  .card:hover { border-color: var(--muted); }
  .card.dragging { opacity: .4; }
  .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .card-title { font-weight: 600; line-height: 1.35; word-break: break-word; }
  .card-summary { font-size: 12px; color: var(--muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-custom { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .card-custom b { font-weight: 600; color: var(--text); }
  .card-foot { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .card-foot .avatar { margin-left: auto; }
  .placeholder { border: 2px dashed var(--accent); border-radius: 8px; height: 56px; background: var(--accent-soft); opacity: .6; }
  .no { font-variant-numeric: tabular-nums; }
  .prio { font-size: 11px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .p-high { background: #fee2e2; color: #b91c1c; }
  .p-medium { background: #fef3c7; color: #b45309; }
  .p-low { background: #e0f2fe; color: #0369a1; }
  @media (prefers-color-scheme: dark) {
    .p-high { background: #7f1d1d; color: #fecaca; }
    .p-medium { background: #78350f; color: #fde68a; }
    .p-low { background: #0c4a6e; color: #bae6fd; }
  }
  .due.overdue { color: var(--danger); font-weight: 600; }
  .done-mark { color: var(--ok); }
  .ms { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 8px; border-radius: 999px; line-height: 1.6; white-space: nowrap; }
  .avatar {
    width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 10px; font-weight: 700; flex: 0 0 auto;
  }
  .avatar.none { background: var(--border); color: var(--muted); }

  /* ---------- table ---------- */
  .table-wrap { padding: 16px; }
  .grid { min-width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); }
  .grid th, .grid td { padding: 3px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; font-size: 13px; line-height: 1.3; }
  .grid th { padding: 6px 8px; background: var(--lane-bg); font-weight: 600; font-size: 12px; color: var(--muted); user-select: none; white-space: nowrap; }
  .grid thead th { position: sticky; top: 0; z-index: 1; }
  .grid th[data-sort] { cursor: pointer; }
  .grid th[data-sort]:hover { color: var(--text); }
  .grid th .arrow { margin-left: 4px; }
  .grid tr.filter-row th { top: 29px; padding: 3px 6px; background: var(--panel); font-weight: 400; }
  .grid tr.filter-row input, .grid tr.filter-row select { width: 100%; padding: 2px 6px; font-size: 12px; min-width: 70px; }
  .grid tr.filter-row .icon-btn { font-size: 12px; }
  .grid tbody tr:last-child td { border-bottom: 0; }
  .grid tbody tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .grid td select, .grid td input, .grid td textarea { padding: 1px 4px; font-size: 12px; border-radius: 4px; }
  .grid td input[type="date"] { width: 124px; }
  .grid td input[type="text"] { width: 130px; }
  .grid td .avatar { width: 18px; height: 18px; font-size: 9px; }
  .grid td .chip { font-size: 10px; padding: 0 6px; line-height: 1.5; }
  .grid .title-cell { cursor: pointer; font-weight: 600; min-width: 220px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid .title-cell:hover { color: var(--accent); text-decoration: underline; }
  .grid .summary-cell { cursor: pointer; color: var(--muted); font-size: 12px; min-width: 160px; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grid .summary-cell:hover { color: var(--text); }
  .grid .cell-member { display: flex; align-items: center; gap: 6px; }
  .grid .muted { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .grid .longtext { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; cursor: pointer; line-height: 1.5; }

  /* ---------- dialogs ---------- */
  & dialog {
    border: 0; border-radius: 12px; padding: 0;
    width: min(620px, 94vw);
    background: var(--panel); color: var(--text);
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
    font-size: 14px;
  }
  & dialog::backdrop { background: rgba(0,0,0,.45); }
  .settings-dialog { width: min(720px, 94vw); }
  .settings-dialog .dlg-body { height: 62vh; max-height: none; }
  .dlg-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .dlg-head h2 { font-size: 15px; }
  .dlg-head .icon-btn { margin-left: auto; font-size: 18px; }
  .dlg-body { padding: 16px 18px; max-height: 70vh; overflow: auto; }
  .dlg-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
  .dlg-foot .spacer { flex: 1; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field input, .field select, .field textarea { width: 100%; }
  .field textarea { min-height: 90px; resize: vertical; }
  .field textarea.short { min-height: 48px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row .field { margin-bottom: 8px; }
  @media (max-width: 520px) { .row { grid-template-columns: 1fr; } }
  .section-title { font-size: 12px; color: var(--muted); font-weight: 600; margin: 14px 0 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-picker label { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; }
  .tag-picker label.on { border-color: transparent; }
  .tag-picker label input { display: none; }
  .tag-picker .tag-new { flex: 1 1 150px; padding: 3px 10px; font-size: 12px; border-radius: 999px; }
  .grid .chips { align-items: center; flex-wrap: nowrap; }
  .grid .chip[data-tag-remove] { cursor: pointer; }
  .grid .chip[data-tag-remove]:hover { text-decoration: line-through; opacity: .8; }
  .grid .tag-add { font-size: 12px; padding: 0 4px; width: 20px; flex: 0 0 auto; }
  .table-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .table-tools select { padding: 4px 8px; font-size: 13px; }
  .columns-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .columns-list label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 0; }
  .columns-list label.fixed { color: var(--muted); }
  .master-row.member-row { grid-template-columns: 20px 34px 1fr auto; }
  .master-row input[type="checkbox"][data-sel] { margin: 0; }
  .bulk-box { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  .bulk-box textarea { min-height: 72px; resize: vertical; }
  .row .field.wide { grid-column: 1 / -1; }
  .meta { font-size: 11px; color: var(--muted); }
  .history { list-style: none; padding: 0; margin: 0; max-height: 220px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  .history li { padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 12px; display: flex; gap: 10px; }
  .history li:last-child { border-bottom: 0; }
  .history .when { color: var(--muted); white-space: nowrap; flex: 0 0 auto; }
  .history .who { color: var(--accent); white-space: nowrap; flex: 0 0 auto; }
  .history .what { flex: 1; }
  .history .what span { display: block; }
  .save-location { font-size: 12px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .save-location a { color: var(--accent); }
  .changes { list-style: none; padding: 0; }
  .changes li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; display: flex; gap: 10px; }
  .changes li:last-child { border-bottom: 0; }
  .changes .grp { flex: 0 0 90px; color: var(--muted); font-size: 12px; }

  .tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 10px 12px; color: var(--muted); margin-bottom: -1px; white-space: nowrap; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .master-list { display: flex; flex-direction: column; gap: 6px; }
  .master-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; }
  .master-row.lane-row { grid-template-columns: 34px 1fr auto auto auto; }
  .master-row.ms-row { grid-template-columns: 150px 1fr auto; }
  .master-row.field-row { grid-template-columns: 1fr 110px 1fr auto auto; }
  .master-row input[type="color"] { width: 34px; height: 30px; padding: 2px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); }
  .master-row .num { width: 70px; }
  .master-row .ctrl { display: inline-flex; gap: 2px; }
  .master-row label.check { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
  .hint code { background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .hint ol { margin: 4px 0 0; padding-left: 20px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .stack strong { display: block; margin-bottom: 4px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  & kbd { font-family: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .2s; z-index: 2147483000; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
<div id="backlog-app" class="backlog-root" data-standalone="1"></div>

  // ---------------------------------------------------------------- 未保存の変更

    if (a.fileName !== b.fileName) out.push(['基本', 'ファイル名: ' + (a.fileName || '(既定)') + ' → ' + (b.fileName || '(既定)')]);
    if (a.saveLocation !== b.saveLocation) out.push(['基本', '保存先: ' + (a.saveLocation || '(未設定)') + ' → ' + (b.saveLocation || '(未設定)')]);

      '<input type="search" data-filter="q" placeholder="検索 (タイトル / サマリー / 概要 / #番号)" value="' + esc(filter.q) + '">' +
      '<select data-filter="lane" title="レーン">' + opt('', 'レーン: すべて', filter.lane) +
        state.lanes.map(function (l) { return opt(l.id, l.name, filter.lane); }).join('') + '</select>' +
      '<select data-filter="assignee" title="担当者">' + opt('', '担当: すべて', filter.assignee) + opt('__none', '未割当', filter.assignee) +
        state.members.map(function (m) { return opt(m.id, m.name, filter.assignee); }).join('') + '</select>' +
      '<select data-filter="tag" title="タグ">' + opt('', 'タグ: すべて', filter.tag) +
        state.tags.map(function (t) { return opt(t.id, t.name, filter.tag); }).join('') + '</select>' +
      (state.milestones.length ? '<select data-filter="milestone" title="マイルストーン">' + opt('', 'MS: すべて', filter.milestone) + opt('__none', 'MS なし', filter.milestone) +
        state.milestones.map(function (m) { return opt(m.id, m.name, filter.milestone); }).join('') + '</select>' : '') +
      '<select data-filter="priority" title="優先度">' + opt('', '優先度: すべて', filter.priority) +
        PRIORITIES.map(function (p) { return opt(p.id, p.label, filter.priority); }).join('') + '</select>';
  }

  function visibleTasks() {
    var q = filter.q.trim().toLowerCase();
    return state.tasks.filter(function (t) {
      if (filter.lane && t.laneId !== filter.lane) return false;
      if (filter.assignee === '__none' && t.assigneeId) return false;
      if (filter.assignee && filter.assignee !== '__none' && t.assigneeId !== filter.assignee) return false;
      if (filter.tag && t.tags.indexOf(filter.tag) < 0) return false;
      if (filter.priority && t.priority !== filter.priority) return false;
      if (filter.milestone === '__none' && t.milestoneId) return false;
      if (filter.milestone && filter.milestone !== '__none' && t.milestoneId !== filter.milestone) return false;
      if (q) {
        var m = memberOf(t.assigneeId), ms = milestoneOf(t.milestoneId);
        var hay = [t.title, t.summary, t.description, '#' + t.no, m ? m.name : '', ms ? ms.name : '',
          t.tags.map(function (id) { var tg = tagOf(id); return tg ? tg.name : ''; }).join(' '),
          Object.keys(t.custom).map(function (k) { return t.custom[k]; }).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function renderMain() {
    var tasks = visibleTasks();
    // 列フィルタ入力中の再描画でフォーカスを失わないようにする
    var ae = document.activeElement;
    var focusKey = ae && ae.dataset && ae.dataset.colfilter && root.contains(ae) ? ae.dataset.colfilter : null;
    var selStart = focusKey && typeof ae.selectionStart === 'number' ? ae.selectionStart : null;
    $('.main').innerHTML = view === 'board' ? renderBoard(tasks) : renderTable(tasks);
    if (focusKey) {
      var el = $('[data-colfilter="' + focusKey.replace(/"/g, '\\"') + '"]');
      if (el) {
        el.focus();
        if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) {} }
      }
    }
  }

  function cardHtml(t) {
    var p = prioOf(t.priority);
    var ms = milestoneOf(t.milestoneId);
    var tags = t.tags.map(function (id) { var tg = tagOf(id); return tg ? chipHtml(tg) : ''; }).join('');
    var custom = state.fields.filter(function (f) { return f.showOnCard && t.custom[f.id]; }).map(function (f) {
      return '<span><b>' + esc(f.name) + ':</b> ' + esc(t.custom[f.id]) + '</span>';
    }).join('');
    return '<article class="card" draggable="true" data-id="' + esc(t.id) + '">' +
      '<div class="card-top"><span class="no">#' + t.no + '</span><span class="prio ' + p.cls + '">' + p.label + '</span></div>' +
      '<div class="card-title">' + esc(t.title) + '</div>' +
      (t.summary ? '<div class="card-summary">' + esc(t.summary) + '</div>' : '') +
      (custom ? '<div class="card-custom">' + custom + '</div>' : '') +
      (tags ? '<div class="chips">' + tags + '</div>' : '') +
      '<div class="card-foot">' +
        (ms ? '<span class="ms" title="マイルストーン' + (ms.date ? ' (' + esc(ms.date) + ')' : '') + '">🏁 ' + esc(ms.name) + '</span>' : '') +
        (t.actualEnd ? '<span class="done-mark" title="完了日 ' + esc(t.actualEnd) + '">✓ ' + fmtDue(t.actualEnd) + '</span>' :
          (t.plannedEnd ? '<span class="due' + (isOverdue(t) ? ' overdue' : '') + '" title="完了予定日 ' + esc(t.plannedEnd) + (t.plannedStart ? ' (着手予定 ' + esc(t.plannedStart) + ')' : '') + '">📅 ' + fmtDue(t.plannedEnd) + '</span>' : '')) +
        avatarHtml(t.assigneeId) +
      '</div>' +
    '</article>';
  }

  function renderBoard(tasks) {
    var cols = state.lanes.map(function (lane) {
      var ts = tasks.filter(function (t) { return t.laneId === lane.id; }).sort(function (a, b) { return a.order - b.order; });
      var total = state.tasks.filter(function (t) { return t.laneId === lane.id; }).length;
      var over = lane.wip > 0 && total > lane.wip;
      return '<section class="lane' + (over ? ' over' : '') + '" data-lane="' + esc(lane.id) + '">' +
        '<header class="lane-head" style="--lane:' + esc(lane.color) + '">' +
          '<span class="lane-name">' + esc(lane.name) + '</span>' +
          '<span class="lane-count" title="' + (lane.wip ? 'WIP 上限 ' + lane.wip : '') + '">' + total + (lane.wip ? ' / ' + lane.wip : '') + '</span>' +
          '<button type="button" class="icon-btn" data-add-lane="' + esc(lane.id) + '" title="このレーンにタスクを追加">＋</button>' +
        '</header>' +
        '<div class="lane-body" data-lane-body="' + esc(lane.id) + '">' + ts.map(cardHtml).join('') + '</div>' +
      '</section>';
    }).join('');
    return '<div class="board">' + cols + '</div>';
  }

  // ---------------------------------------------------------------- table
  function sortedTasks(tasks) {
    var key = sort.key, dir = sort.dir;
    var get = function (t) {
      if (key.indexOf('cf:') === 0) return (t.custom[key.slice(3)] || '￿').toLowerCase();
      switch (key) {
        case 'no': return t.no;
        case 'title': return t.title.toLowerCase();
        case 'summary': return t.summary ? t.summary.toLowerCase() : '\uffff';
        case 'lane': return state.lanes.indexOf(laneOf(t.laneId));
        case 'assignee': var m = memberOf(t.assigneeId); return m ? m.name : '￿';
        case 'priority': return prioOf(t.priority).rank;
        case 'milestone': var ms = milestoneOf(t.milestoneId); return ms ? (ms.date || '9999') + ms.name : '￿';
        case 'plannedStart': case 'plannedEnd': case 'actualStart': case 'actualEnd': return t[key] || '￿';
        case 'updated': return t.updatedAt;
        default: return t.no;
      }
    };
    return tasks.slice().sort(function (a, b) {
      var x = get(a), y = get(b);
      if (x < y) return -dir;
      if (x > y) return dir;
      return a.no - b.no;
    });
  }

  function matchDate(val, v) {
    return (val || '').indexOf(v) >= 0;
  }
  function matchCol(t, key, v) {
    var lv = v.toLowerCase();
    if (key === 'title') return t.title.toLowerCase().indexOf(lv) >= 0;
    if (key === 'summary') return t.summary.toLowerCase().indexOf(lv) >= 0;
    if (key === 'lane') return t.laneId === v;
    if (key === 'assignee') return v === '__none' ? !t.assigneeId : t.assigneeId === v;
    if (key === 'priority') return t.priority === v;
    if (key === 'milestone') return v === '__none' ? !t.milestoneId : t.milestoneId === v;
    if (key === 'tag') return v === '__none' ? !t.tags.length : t.tags.indexOf(v) >= 0;
    if (key === 'updated') return fmtDate(t.updatedAt).indexOf(v) >= 0;
    if (DATE_KEYS.indexOf(key) >= 0) return matchDate(t[key], v);
    if (key.indexOf('cf:') === 0) {
      var f = fieldOf(key.slice(3));
      if (!f) return true;
      var val = t.custom[f.id] || '';
      if (f.type === 'list') return v === '__none' ? !val : val === v;
      return val.toLowerCase().indexOf(lv) >= 0;
    }
    return true;
  }
  function applyColFilters(tasks) {
    var keys = Object.keys(colFilter).filter(function (k) { return colFilter[k]; });
    if (!keys.length) return tasks;
    return tasks.filter(function (t) {
      for (var i = 0; i < keys.length; i++) if (!matchCol(t, keys[i], colFilter[keys[i]])) return false;
      return true;
    });
  }

  // ---------------------------------------------------------------- table columns / views
  function columnDefs() {
    var cols = [
      { key: 'no', label: '#', fixed: true },
      { key: 'title', label: 'タイトル', fixed: true },
      { key: 'summary', label: 'サマリー' },
      { key: 'lane', label: 'レーン' },
      { key: 'assignee', label: '担当' },
      { key: 'priority', label: '優先度' },
      { key: 'milestone', label: 'MS' },
      { key: 'plannedStart', label: '着手予定' },
      { key: 'plannedEnd', label: '完了予定' },
      { key: 'actualStart', label: '着手日' },
      { key: 'actualEnd', label: '完了日' },
      { key: 'tags', label: 'タグ' }
    ];
    state.fields.forEach(function (f) { cols.push({ key: 'cf:' + f.id, label: f.name, field: f }); });
    cols.push({ key: 'updated', label: '更新日' });
    return cols;
  }
  function visibleColumns() {
    return columnDefs().filter(function (c) { return c.fixed || !hiddenCols[c.key]; });
  }
  function activeView() { return activeViewId ? findById(state.views, activeViewId) : null; }
  function currentViewSettings() {
    var cf = {};
    Object.keys(colFilter).forEach(function (k) { if (colFilter[k]) cf[k] = colFilter[k]; });
    return {
      filter: clone(filter), colFilter: cf, sort: clone(sort),
      hiddenCols: Object.keys(hiddenCols).filter(function (k) { return hiddenCols[k]; }).sort()
    };
  }
  function viewSettingsOf(v) {
    var cf = {};
    Object.keys(v.colFilter).forEach(function (k) { if (v.colFilter[k]) cf[k] = v.colFilter[k]; });
    return { filter: Object.assign(clone(EMPTY_FILTER), v.filter), colFilter: cf, sort: clone(v.sort), hiddenCols: v.hiddenCols.slice().sort() };
  }
  function sameViewSettings(v) {
    return JSON.stringify(currentViewSettings()) === JSON.stringify(viewSettingsOf(v));
  }
  function applyView(v) {
    if (!v) {
      activeViewId = '';
      filter = clone(EMPTY_FILTER); colFilter = {}; sort = { key: 'no', dir: 1 }; hiddenCols = {};
    } else {
      var vs = viewSettingsOf(v);
      activeViewId = v.id;
      filter = vs.filter; colFilter = vs.colFilter; sort = vs.sort; hiddenCols = {};
      vs.hiddenCols.forEach(function (k) { hiddenCols[k] = true; });
    }
    renderHeader();
    renderMain();
  }
  function saveView(existing) {
    var name;
    if (existing) name = existing.name;
    else {
      name = prompt('ビュー名を入力してください', '');
      if (name == null) return;
      name = name.trim();
      if (!name) return;
    }
    var vs = currentViewSettings();
    if (existing) Object.assign(existing, vs);
    else {
      var v = Object.assign({ id: uid(), name: name }, vs);
      state.views.push(v);
      activeViewId = v.id;
    }
    setDirty(true);
    renderMain();
    toast('ビュー「' + name + '」を保存しました');
  }
  function tableToolbarHtml(count, total) {
    var v = activeView();
    var modified = v && !sameViewSettings(v);
    return '<div class="table-tools">' +
      '<select data-saved-view title="保存したビュー (絞り込み・並び順・列表示のセット)">' + opt('', 'ビュー: (なし)', activeViewId) +
        state.views.map(function (x) { return opt(x.id, x.name, activeViewId); }).join('') + '</select>' +
      (v ? '<button type="button" class="btn small" data-act="view-update"' + (modified ? '' : ' disabled') + ' title="現在の絞り込み・並び順・列表示でこのビューを上書き">上書き保存' + (modified ? ' *' : '') + '</button>' : '') +
      '<button type="button" class="btn small" data-act="view-save" title="現在の絞り込み・並び順・列表示をビューとして保存">' + (v ? '別名で保存' : 'ビューとして保存') + '</button>' +
      (v ? '<button type="button" class="btn small" data-act="view-rename">名前変更</button><button type="button" class="btn small danger" data-act="view-delete">削除</button>' : '') +
      '<button type="button" class="btn small" data-act="columns">列の表示…</button>' +
      '<span class="meta" style="margin-left:auto">' + count + (count !== total ? ' / ' + total : '') + ' 件</span>' +
    '</div>';
  }
  function openColumnsDialog() {
    var dlg = $('.columns-dialog');
    dlg.innerHTML =
      '<div class="dlg-head"><h2>表示する列</h2><button type="button" class="icon-btn" data-close>×</button></div>' +
      '<div class="dlg-body"><div class="columns-list">' +
        columnDefs().map(function (c) {
          return '<label class="' + (c.fixed ? 'fixed' : '') + '"><input type="checkbox" data-col="' + esc(c.key) + '"' + (c.fixed ? ' checked disabled' : (hiddenCols[c.key] ? '' : ' checked')) + '>' + esc(c.label) + '</label>';
        }).join('') +
      '</div><p class="hint">列の表示状態はビューに保存できます。</p></div>' +
      '<div class="dlg-foot"><button type="button" class="btn small" data-act="cols-all">すべて表示</button><span class="spacer"></span><button type="button" class="btn primary" data-close>閉じる</button></div>';
    if (!dlg.open) dlg.showModal();
  }

  function renderTable(tasks) {
    var cols = visibleColumns();
    var filtered = applyColFilters(tasks);
    var hasColFilter = Object.keys(colFilter).some(function (k) { return colFilter[k]; });
    var cf = function (key) { return colFilter[key] || ''; };
    var th = function (key, label) {
      var arrow = sort.key === key ? '<span class="arrow">' + (sort.dir > 0 ? '▲' : '▼') + '</span>' : '';
      return '<th data-sort="' + esc(key) + '">' + esc(label) + arrow + '</th>';
    };
    var ftext = function (key, ph) { return '<th><input type="text" data-colfilter="' + esc(key) + '" value="' + esc(cf(key)) + '" placeholder="' + esc(ph || '絞り込み') + '"></th>'; };
    var fselect = function (key, options) { return '<th><select data-colfilter="' + esc(key) + '">' + opt('', 'すべて', cf(key)) + options + '</select></th>'; };

    var headCell = function (c) { return c.key === 'tags' ? '<th>タグ</th>' : th(c.key, c.label); };
    var filterCell = function (c) {
      switch (c.key) {
        case 'no': return '<th>' + (hasColFilter ? '<button type="button" class="icon-btn" data-act="clear-colfilter" title="列の絞り込みをクリア">✕</button>' : '') + '</th>';
        case 'title': return ftext('title', 'タイトル');
        case 'summary': return ftext('summary', 'サマリー');
        case 'lane': return fselect('lane', state.lanes.map(function (l) { return opt(l.id, l.name, cf('lane')); }).join(''));
        case 'assignee': return fselect('assignee', opt('__none', '未割当', cf('assignee')) + state.members.map(function (m) { return opt(m.id, m.name, cf('assignee')); }).join(''));
        case 'priority': return fselect('priority', PRIORITIES.map(function (p) { return opt(p.id, p.label, cf('priority')); }).join(''));
        case 'milestone': return fselect('milestone', opt('__none', 'なし', cf('milestone')) + state.milestones.map(function (m) { return opt(m.id, m.name, cf('milestone')); }).join(''));
        case 'plannedStart': case 'plannedEnd': case 'actualStart': case 'actualEnd': return ftext(c.key, '2026-10');
        case 'tags': return fselect('tag', opt('__none', 'なし', cf('tag')) + state.tags.map(function (t) { return opt(t.id, t.name, cf('tag')); }).join(''));
        case 'updated': return ftext('updated', '2026/10');
      }
      if (c.field) {
        if (c.field.type === 'list') return fselect(c.key, opt('__none', 'なし', cf(c.key)) + c.field.options.map(function (o) { return opt(o, o, cf(c.key)); }).join(''));
        return ftext(c.key, c.field.type === 'date' ? '2026-10' : '絞り込み');
      }
      return '<th></th>';
    };
    var cell = function (c, t) {
      var dateCell = function (key) {
        var warn = key === 'plannedEnd' && isOverdue(t);
        return '<td><input type="date" data-field="' + key + '" data-id="' + esc(t.id) + '" value="' + esc(t[key]) + '"' + (warn ? ' style="color:var(--danger)"' : '') + '></td>';
      };
      switch (c.key) {
        case 'no': return '<td class="muted">#' + t.no + '</td>';
        case 'title': return '<td class="title-cell" data-open="' + esc(t.id) + '" title="' + esc(t.title) + '">' + esc(t.title) + '</td>';
        case 'summary': return '<td class="summary-cell" data-open="' + esc(t.id) + '" title="' + esc(t.summary) + '">' + (t.summary ? esc(t.summary) : '<span class="muted">–</span>') + '</td>';
        case 'lane': return '<td><select data-field="laneId" data-id="' + esc(t.id) + '">' + state.lanes.map(function (l) { return opt(l.id, l.name, t.laneId); }).join('') + '</select></td>';
        case 'assignee': return '<td><div class="cell-member">' + avatarHtml(t.assigneeId) + '<select data-field="assigneeId" data-id="' + esc(t.id) + '">' + opt('', '未割当', t.assigneeId) + state.members.map(function (m) { return opt(m.id, m.name, t.assigneeId); }).join('') + '</select></div></td>';
        case 'priority': return '<td><select data-field="priority" data-id="' + esc(t.id) + '">' + PRIORITIES.map(function (p) { return opt(p.id, p.label, t.priority); }).join('') + '</select></td>';
        case 'milestone': return '<td><select data-field="milestoneId" data-id="' + esc(t.id) + '">' + opt('', '–', t.milestoneId) + state.milestones.map(function (m) { return opt(m.id, m.name, t.milestoneId); }).join('') + '</select></td>';
        case 'plannedStart': case 'plannedEnd': case 'actualStart': case 'actualEnd': return dateCell(c.key);
        case 'tags':
          // 「＋」はセル先頭の固定位置に置き、タグ数に関わらず縦に揃える
          return '<td><div class="chips">' +
            '<button type="button" class="icon-btn tag-add" data-tag-add="' + esc(t.id) + '" title="タグを追加 (新規タグはその場で作成)">＋</button>' +
            t.tags.map(function (id) { var tg = tagOf(id); return tg ? chipHtml(tg, 'data-tag-remove="' + esc(id) + '" data-id="' + esc(t.id) + '" title="クリックで外す"') : ''; }).join('') +
            '</div></td>';
        case 'updated': return '<td class="muted">' + fmtDate(t.updatedAt) + '</td>';
      }
      if (c.field) {
        var f = c.field, v = t.custom[f.id] || '';
        if (f.type === 'longtext') return '<td><div class="longtext" data-open="' + esc(t.id) + '" title="' + esc(v) + '">' + (v ? esc(v) : '–') + '</div></td>';
        return '<td>' + customInput(f, v, 'data-custom="' + esc(f.id) + '" data-id="' + esc(t.id) + '"') + '</td>';
      }
      return '<td></td>';
    };

    var rows = sortedTasks(filtered).map(function (t) {
      return '<tr data-id="' + esc(t.id) + '">' + cols.map(function (c) { return cell(c, t); }).join('') + '</tr>';
    }).join('');
    if (!rows) rows = '<tr><td colspan="' + cols.length + '" class="empty">該当するタスクはありません</td></tr>';
    return '<div class="table-wrap">' + tableToolbarHtml(filtered.length, state.tasks.length) +
      '<table class="grid"><thead>' +
      '<tr>' + cols.map(headCell).join('') + '</tr>' +
      '<tr class="filter-row">' + cols.map(filterCell).join('') + '</tr>' +
      '</thead><tbody>' + rows + '</tbody></table></div>';
  }

  // カスタム項目の入力欄 (テーブル / ダイアログ共通)
  function customInput(f, v, attrs) {
    if (f.type === 'list') {
      var extra = v && f.options.indexOf(v) < 0 ? opt(v, v, v) : '';
      return '<select ' + attrs + '>' + opt('', '–', v) + extra + f.options.map(function (o) { return opt(o, o, v); }).join('') + '</select>';
    }
    if (f.type === 'date') return '<input type="date" ' + attrs + ' value="' + esc(v) + '">';
    if (f.type === 'longtext') return '<textarea ' + attrs + '>' + esc(v) + '</textarea>';
    return '<input type="text" ' + attrs + ' value="' + esc(v) + '">';
  }

  // ---------------------------------------------------------------- task dialog
  function tagPickerHtml(selected) {
    return state.tags.map(function (tg) {
      var on = selected.indexOf(tg.id) >= 0;
      return '<label class="' + (on ? 'on' : '') + '" style="' + (on ? 'background:' + esc(tg.color) + ';color:' + textOn(tg.color) : '') + '">' +
        '<input type="checkbox" name="tags" value="' + esc(tg.id) + '"' + (on ? ' checked' : '') + '>' + esc(tg.name) + '</label>';
    }).join('') +
    '<input type="text" class="tag-new" placeholder="＋ 新しいタグ (Enter で追加)" title="既存のタグ名なら選択、なければ新規作成します">';
  }
  function openTaskDialog(id, laneId) {
    var t = id ? taskOf(id) : null;
    if (id && !t) return;
    var dlg = $('.task-dialog');
    var cur = t || { title: '', summary: '', description: '', laneId: laneId || state.lanes[0].id, assigneeId: '', priority: 'medium', milestoneId: '',
      plannedStart: '', plannedEnd: '', actualStart: '', actualEnd: '', tags: [], custom: {}, history: [] };
    var dateField = function (key) {
      return '<div class="field"><label>' + FIELD_LABELS[key] + '</label><input type="date" name="' + key + '" value="' + esc(cur[key]) + '"></div>';
    };
    // カスタム項目は標準項目と同じグリッドに並べる (long text は 1 行を占有)
    var customHtml = state.fields.map(function (f) {
      return '<div class="field' + (f.type === 'longtext' ? ' wide' : '') + '"><label>' + esc(f.name) + '</label>' + customInput(f, cur.custom[f.id] || '', 'name="cf:' + esc(f.id) + '"') + '</div>';
    }).join('');
    var historyHtml = '';
    if (t) {
      var items = t.history.slice().reverse().map(function (h) {
        return '<li><span class="when">' + esc(fmtDateTime(h.at)) + '</span>' + (h.by ? '<span class="who">' + esc(h.by) + '</span>' : '') +
          '<span class="what">' + h.changes.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</span></li>';

  function masterList(kind) { return state[kind]; }
  function sortMilestones() {
    state.milestones.sort(function (a, b) { var x = a.date || '9999', y = b.date || '9999'; return x < y ? -1 : x > y ? 1 : 0; });
  }

    renderSettingsBody();

  function handleSettingsInput(e) {
    var el = e.target;
    if (el.dataset.setting === 'title') {
      state.title = el.value.trim() || 'Backlog.html';
      setDirty(true);
      $('.app-title').textContent = state.title;
      return;
    }
    if (el.dataset.setting === 'fileName') { state.fileName = el.value.trim(); setDirty(true); return; }
    if (el.dataset.setting === 'saveLocation') { state.saveLocation = el.value.trim(); setDirty(true); return; }
    if (el.dataset.setting === 'actor') { setActor(el.value); return; }
    var row = el.closest('.master-row');
    if (!row || !el.dataset.key) return;
    var kind = row.parentElement.dataset.kind;
    var item = findById(masterList(kind), row.dataset.id);
    if (!item) return;
    var key = el.dataset.key;
    if (key === 'done' || key === 'showOnCard') item[key] = el.checked;
    else if (key === 'wip') item.wip = Math.max(0, Number(el.value) || 0);
    else if (key === 'options') item.options = el.value.split(/[,、]/).map(function (s) { return s.trim(); }).filter(Boolean);
    else item[key] = el.value;
    if (kind === 'milestones' && key === 'date') sortMilestones();
    if (kind === 'fields' && key === 'type') {
      var optInput = $('input[data-key="options"]', row);
      if (optInput) optInput.disabled = item.type !== 'list';
      // 型変更で値が不正になる場合は日付のみ正規化する
      if (item.type === 'date') state.tasks.forEach(function (t) { if (t.custom[item.id]) { var d = normDate(t.custom[item.id]); if (d) t.custom[item.id] = d; else delete t.custom[item.id]; } });
    }
    setDirty(true);
    renderHeader();
    renderMain();
  }

  function handleSettingsClick(e) {
    var dlg = $('.settings-dialog');
    var el = e.target;
    if (el.closest('[data-close]')) { dlg.close(); return; }
    var tabBtn = el.closest('[data-tab]');
    if (tabBtn) { settingsTab = tabBtn.dataset.tab; bulkSel = {}; renderSettingsBody(); return; }
    var bulk = el.closest('[data-bulk]');
    if (bulk) { handleBulk(bulk.dataset.bulk, dlg); return; }

    var addBtn = el.closest('[data-add]');
    if (addBtn) {
      var kind = addBtn.dataset.add;
      var arr = masterList(kind);
      var item;
      if (kind === 'milestones') item = { id: uid(), name: '', date: '' };
      else if (kind === 'fields') item = { id: uid(), name: '', type: 'text', options: [], showOnCard: false };
      else item = { id: uid(), name: '', color: PALETTE[arr.length % PALETTE.length] };
      if (kind === 'lanes') { item.done = false; item.wip = 0; }
      arr.push(item);
      setDirty(true);
      refreshAll();
      var rows = $$('.master-row', dlg);
      var last = rows[rows.length - 1];
      if (last) $('input[data-key="name"]', last).focus();
      return;
    }

    var row = el.closest('.master-row');
    if (!row) {
      var act = el.closest('[data-action]');
      if (act && act.tagName !== 'INPUT') handleDataAction(act.dataset.action);
      return;
    }
    var kind2 = row.parentElement.dataset.kind;
    var list = masterList(kind2);
    var idx = list.indexOf(findById(list, row.dataset.id));
    if (idx < 0) return;

    var mv = el.closest('[data-move]');
    if (mv) {
      var to = idx + Number(mv.dataset.move);
      if (to < 0 || to >= list.length) return;
      var tmp = list[idx]; list[idx] = list[to]; list[to] = tmp;
      setDirty(true);
      refreshAll();
      return;
    }
    if (el.closest('[data-remove]')) {
      var item2 = list[idx];
      var label = item2.name || '(名称未設定)';
      if (kind2 === 'lanes') {
        if (list.length === 1) { toast('レーンは最低 1 つ必要です'); return; }
        var count = state.tasks.filter(function (t) { return t.laneId === item2.id; }).length;
        var msg = 'レーン「' + label + '」を削除しますか？' + (count ? '\n' + count + ' 件のタスクは先頭のレーンに移動します。' : '');
        if (!confirm(msg)) return;
        list.splice(idx, 1);
        var target = list[0].id;
        state.tasks.forEach(function (t) { if (t.laneId === item2.id) { t.laneId = target; t.order = nextOrder(target); } });
      } else if (kind2 === 'members') {
        if (!confirm('メンバー「' + label + '」を削除しますか？')) return;
        list.splice(idx, 1);
        state.tasks.forEach(function (t) { if (t.assigneeId === item2.id) t.assigneeId = ''; });
      } else if (kind2 === 'milestones') {
        if (!confirm('マイルストーン「' + label + '」を削除しますか？')) return;
        list.splice(idx, 1);
        state.tasks.forEach(function (t) { if (t.milestoneId === item2.id) t.milestoneId = ''; });
      } else if (kind2 === 'fields') {
        var used = state.tasks.filter(function (t) { return t.custom[item2.id]; }).length;
        if (!confirm('カスタム項目「' + label + '」を削除しますか？' + (used ? '\n' + used + ' 件のタスクに入力された値も削除されます。' : ''))) return;
        list.splice(idx, 1);
        state.tasks.forEach(function (t) { delete t.custom[item2.id]; });
        delete colFilter['cf:' + item2.id];
        if (sort.key === 'cf:' + item2.id) sort = { key: 'no', dir: 1 };
      } else {
        if (!confirm('タグ「' + label + '」を削除しますか？')) return;
        list.splice(idx, 1);
        state.tasks.forEach(function (t) { t.tags = t.tags.filter(function (id) { return id !== item2.id; }); });
      }
      setDirty(true);
      refreshAll();
    }
  }

  function handleBulk(action, dlg) {
    if (action === 'select-all') {
      var all = state.members.length && state.members.every(function (m) { return bulkSel[m.id]; });
      bulkSel = {};
      if (!all) state.members.forEach(function (m) { bulkSel[m.id] = true; });
      renderSettingsBody();
      return;
    }
    if (action === 'delete') {
      var targets = state.members.filter(function (m) { return bulkSel[m.id]; });
      if (!targets.length) return;
      if (!confirm(targets.length + ' 名のメンバーを削除しますか？\n' + targets.map(function (m) { return m.name || '(名称未設定)'; }).join(', ') + '\n\n割り当てられていたタスクは「未割当」になります。')) return;
      var ids = {};
      targets.forEach(function (m) { ids[m.id] = true; });
      state.members = state.members.filter(function (m) { return !ids[m.id]; });
      state.tasks.forEach(function (t) { if (ids[t.assigneeId]) t.assigneeId = ''; });
      bulkSel = {};
      setDirty(true);
      refreshAll();
      toast(targets.length + ' 名を削除しました');
      return;
    }
    if (action === 'add') {
      var ta = $('[data-bulk-input]', dlg);
      var names = (ta ? ta.value : '').split(/[\r\n,、]+/).map(function (n) { return n.trim(); }).filter(Boolean);
      var added = 0, skipped = 0;
      names.forEach(function (n) {
        if (findByName(state.members, n)) { skipped++; return; }
        state.members.push({ id: uid(), name: n, color: PALETTE[state.members.length % PALETTE.length] });
        added++;
      });
      if (!added && !skipped) { toast('追加する名前を入力してください'); return; }
      setDirty(true);
      refreshAll();
      toast(added + ' 名を追加しました' + (skipped ? ' (' + skipped + ' 名は既存のためスキップ)' : ''));
    }
  }

  function handleDataAction(action) {
    var base = currentFileName().replace(/\.(html?|aspx)$/i, '');
    if (action === 'save-as') { fileHandle = null; saveToFile(true); }
    else if (action === 'download') { downloadHtml(); }
    else if (action === 'download-fragment') {
      download(buildFragment(false), base + '.inline.html');
      toast('埋め込み用 HTML をダウンロードしました');
    }
    else if (action === 'export') {
      download(JSON.stringify(state, null, 2), base + '.json', 'application/json;charset=utf-8');
    }
    else if (action === 'export-csv') {
      download('﻿' + buildCsv(), base + '.csv', 'text/csv;charset=utf-8');
      toast('CSV をエクスポートしました (' + state.tasks.length + ' 件)');
    }
  }

  // ---------------------------------------------------------------- import / export
  var CSV_COLUMNS = [
    { key: 'no', label: '番号', aliases: ['no', '#', 'id', 'number'] },
    { key: 'title', label: 'タイトル', aliases: ['title', '件名'] },
    { key: 'summary', label: 'サマリー', aliases: ['summary', '要約'] },
    { key: 'description', label: '概要', aliases: ['description', '説明', '詳細'] },
    { key: 'lane', label: 'レーン', aliases: ['lane', 'status', 'ステータス', '状態'] },
    { key: 'assignee', label: '担当者', aliases: ['assignee', '担当'] },
    { key: 'priority', label: '優先度', aliases: ['priority'] },
    { key: 'milestone', label: 'マイルストーン', aliases: ['milestone', 'ms'] },
    { key: 'plannedStart', label: '着手予定日', aliases: ['plannedstart', '開始予定日'] },
    { key: 'plannedEnd', label: '完了予定日', aliases: ['plannedend', 'due', '期限', '期日'] },
    { key: 'actualStart', label: '着手日', aliases: ['actualstart', '開始日'] },
    { key: 'actualEnd', label: '完了日', aliases: ['actualend'] },
    { key: 'tags', label: 'タグ', aliases: ['tags', 'tag', 'labels'] },
    { key: 'createdAt', label: '作成日時', aliases: ['createdat'] },
    { key: 'updatedAt', label: '更新日時', aliases: ['updatedat'] }
  ];
  function csvEscape(v) {
    v = String(v == null ? '' : v);
    return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function taskToCsvRow(t) {
    var lane = laneOf(t.laneId), m = memberOf(t.assigneeId), ms = milestoneOf(t.milestoneId);
    var base = {
      no: t.no, title: t.title, summary: t.summary, description: t.description,
      lane: lane ? lane.name : '', assignee: m ? m.name : '', priority: prioOf(t.priority).label, milestone: ms ? ms.name : '',
      plannedStart: t.plannedStart, plannedEnd: t.plannedEnd, actualStart: t.actualStart, actualEnd: t.actualEnd,
      tags: t.tags.map(function (id) { var tg = tagOf(id); return tg ? tg.name : ''; }).filter(Boolean).join(', '),
      createdAt: t.createdAt, updatedAt: t.updatedAt
    };
    return CSV_COLUMNS.map(function (c) { return base[c.key]; }).concat(state.fields.map(function (f) { return t.custom[f.id] || ''; }));
  }
  function buildCsv() {
    var header = CSV_COLUMNS.map(function (c) { return c.label; }).concat(state.fields.map(function (f) { return f.name; }));
    var lines = [header.map(csvEscape).join(',')];
    sortedTasks(state.tasks).forEach(function (t) { lines.push(taskToCsvRow(t).map(csvEscape).join(',')); });
    return lines.join('\r\n') + '\r\n';
  }
  function parseCsv(text) {
    var rows = [], row = [], field = '', i = 0, inQ = false;
    text = text.replace(/^﻿/, '');
    while (i < text.length) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQ = false; i++; continue;
        }
        field += c; i++; continue;
      }
      if (c === '"') { inQ = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') { i++; continue; }
      if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
      field += c; i++;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return v.trim() !== ''; }); });
  }

  function importFile(file) {
    if (!file) return;
    file.text().then(function (text) {
      var trimmed = text.replace(/^﻿/, '').trim();
      var name = (file.name || '').toLowerCase();
      if (/\.csv$/.test(name)) { importCsv(text); return; }
      if (trimmed[0] === '{' || /\.json$/.test(name)) { importJsonText(trimmed, file.name); return; }
      if (/id="backlog-data"/.test(trimmed) || /\.(html?|aspx)$/.test(name)) { importHtmlText(trimmed, file.name); return; }
      importCsv(text);
    }).catch(function (e) { console.error(e); toast('ファイルの読み込みに失敗しました'); });
  }
  function importJsonText(text, name) {
    var parsed;
    try { parsed = JSON.parse(text); } catch (e) { toast('JSON の解析に失敗しました'); return; }
    replaceAllData(parsed, name);
  }
  function importHtmlText(text, name) {
    // 保存済み HTML から <script type="application/json" id="backlog-data"> の中身を取り出す
    var m = /<script[^>]*id="backlog-data"[^>]*>([\s\S]*?)<\/script\s*>/i.exec(text);
    if (!m) { toast('この HTML にはタスクデータが含まれていません'); return; }
    importJsonText(m[1].trim(), name);
  }
  function replaceAllData(parsed, name) {
    var next = normalize(parsed);
    if (!confirm('現在のデータを「' + (name || 'インポート内容') + '」で置き換えますか？\n(タスク ' + next.tasks.length + ' 件 / メンバー ' + next.members.length + ' / レーン ' + next.lanes.length + ' / タグ ' + next.tags.length + ' / マイルストーン ' + next.milestones.length + ' / カスタム項目 ' + next.fields.length + ')')) return;
    state = next;
    colFilter = {}; hiddenCols = {}; activeViewId = '';
    sort = { key: 'no', dir: 1 };
    setDirty(true);
    refreshAll();
    toast('インポートしました (タスク ' + state.tasks.length + ' 件)');
  }
  function importCsv(text) {
    var rows = parseCsv(text);
    if (rows.length < 2) { toast('CSV にデータ行がありません'); return; }
    var header = rows[0].map(function (h) { return String(h).trim(); });
    var colMap = {};   // key -> column index
    var customMap = {}; // fieldId -> column index
    header.forEach(function (h, i) {
      var lh = h.toLowerCase();
      var col = null;
      for (var c = 0; c < CSV_COLUMNS.length; c++) {
        if (CSV_COLUMNS[c].label === h || CSV_COLUMNS[c].aliases.indexOf(lh) >= 0) { col = CSV_COLUMNS[c]; break; }
      }
      if (col) { if (colMap[col.key] == null) colMap[col.key] = i; return; }
      var f = findByName(state.fields, h);
      if (f && customMap[f.id] == null) customMap[f.id] = i;
    });
    if (colMap.title == null) { toast('CSV に「タイトル」列が見つかりません'); return; }
    var has = function (key) { return colMap[key] != null; };
    var cell = function (r, key) { return has(key) ? String(r[colMap[key]] == null ? '' : r[colMap[key]]).trim() : ''; };
    var dataRows = rows.slice(1);
    var updates = 0, creates = 0, skipped = 0, newMasters = [];
    dataRows.forEach(function (r) {
      var no = Number(cell(r, 'no'));
      if (has('no') && no && state.tasks.some(function (t) { return t.no === no; })) updates++;
      else if (cell(r, 'title')) creates++;
      else skipped++;
    });
    var ensureMaster = function (kind, name, make) {
      name = String(name || '').trim();
      if (!name) return null;
      var found = findByName(state[kind], name);
      if (found) return found;
      var item = make(name);
      state[kind].push(item);
      newMasters.push(MASTER_LABELS[kind] + '「' + name + '」');
      return item;
    };
    var msg = 'CSV をインポートしますか？\n更新: ' + updates + ' 件 (番号が一致) / 新規追加: ' + creates + ' 件' + (skipped ? ' / スキップ: ' + skipped + ' 件 (タイトルなし)' : '') +
      '\n\n列: ' + Object.keys(colMap).map(function (k) { return findById(CSV_COLUMNS.map(function (c) { return { id: c.key, label: c.label }; }), k).label; }).concat(Object.keys(customMap).map(function (id) { var f = fieldOf(id); return f ? f.name : id; })).join(', ');
    if (!confirm(msg)) return;

    var applied = 0;
    dataRows.forEach(function (r) {
      var title = cell(r, 'title');
      var no = Number(cell(r, 'no'));
      var t = has('no') && no ? state.tasks.filter(function (x) { return x.no === no; })[0] : null;
      if (!t && !title) return;
      var isNew = !t;
      if (isNew) {
        t = {
          id: uid(), no: state.nextNo++, title: title, summary: '', description: '', laneId: state.lanes[0].id, assigneeId: '', priority: 'medium', milestoneId: '',
          plannedStart: '', plannedEnd: '', actualStart: '', actualEnd: '', tags: [], custom: {}, order: 0, createdAt: nowIso(), updatedAt: nowIso(), history: []
        };
      }
      var before = snapshot(t);
      if (title) t.title = title;
      if (has('summary')) t.summary = cell(r, 'summary');
      if (has('description')) t.description = cell(r, 'description');
      if (has('assignee')) { var m = ensureMaster('members', cell(r, 'assignee'), function (n) { return { id: uid(), name: n, color: PALETTE[state.members.length % PALETTE.length] }; }); t.assigneeId = m ? m.id : ''; }
      if (has('priority')) {
        var pv = cell(r, 'priority').toLowerCase();
        var p = PRIORITIES.filter(function (x) { return x.id === pv || x.label === pv; })[0];
        if (p) t.priority = p.id;
      }
      if (has('milestone')) { var ms = ensureMaster('milestones', cell(r, 'milestone'), function (n) { return { id: uid(), name: n, date: '' }; }); t.milestoneId = ms ? ms.id : ''; }
      DATE_KEYS.forEach(function (k) { if (has(k)) t[k] = normDate(cell(r, k)); });
      if (has('tags')) {
        t.tags = cell(r, 'tags').split(/[,、;|]/).map(function (s) { return s.trim(); }).filter(Boolean).map(function (n) {
          return ensureMaster('tags', n, function (nn) { return { id: uid(), name: nn, color: PALETTE[state.tags.length % PALETTE.length] }; }).id;
        }).filter(function (id, i, arr) { return arr.indexOf(id) === i; });
      }
      Object.keys(customMap).forEach(function (fid) {
        var f = fieldOf(fid);
        var v = String(r[customMap[fid]] == null ? '' : r[customMap[fid]]).trim();
        if (f && f.type === 'date') v = normDate(v);
        if (v) t.custom[fid] = v; else delete t.custom[fid];
      });
      if (has('lane')) {
        var lane = ensureMaster('lanes', cell(r, 'lane'), function (n) { return { id: uid(), name: n, color: PALETTE[state.lanes.length % PALETTE.length], done: false, wip: 0 }; });
        if (lane && lane.id !== t.laneId) { if (isNew) t.laneId = lane.id; else applyLaneChange(t, lane.id); }
      }
      if (isNew) {
        t.order = nextOrder(t.laneId);
        addHistory(t, ['作成 (CSV インポート)']);
        state.tasks.push(t);
      } else {
        recordDiff(t, before, '(CSV インポート)');
      }
      applied++;
    });
    sortMilestones();
    setDirty(true);
    refreshAll();
    toast('CSV から ' + applied + ' 件を取り込みました' + (newMasters.length ? ' / 新規マスタ: ' + newMasters.join(', ') : ''));
  }

  // ---------------------------------------------------------------- HTML 生成
  function defaultFileName() {
    if (fileHandle && fileHandle.name) return fileHandle.name;
    if (isStandalone) {
      var seg = '';
      try { seg = decodeURIComponent((location.pathname.split('/').pop() || '').split('?')[0]); } catch (e) {}
      if (/\.(html?|aspx)$/i.test(seg)) return seg;
    }
    return 'backlog.html';
  }
  function currentFileName() {
    return state.fileName || defaultFileName();
  }

  function dataJson() {
    // "</script" や "<!--" が JSON 内に含まれても HTML パーサを壊さないよう、"<" を JSON の \u エスケープに置き換える
    return JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
  }

  function buildFragment(standalone) {
    var S = '<' + 'script', SE = '<' + '/script>';
    return '<!-- ===== Backlog app : ここから下のブロックは他ページへそのまま埋め込み可能 ===== -->\n' +
      '<style id="backlog-style">' + STYLE_TEXT + '<' + '/style>\n' +
      '<div id="backlog-app" class="backlog-root"' + (standalone ? ' data-standalone="1"' : ' style="--backlog-height: 80vh"') + '></div>\n\n' +
      '<!-- タスクデータ。「保存」「ダウンロード」でこのブロックが更新された HTML が生成されます。 -->\n' +
      (state.saveLocation ? '<!-- 保存先: ' + state.saveLocation.replace(/--/g, '- -') + ' -->\n' : '') +
      S + ' type="application/json" id="backlog-data">\n' + dataJson() + '\n' + SE + '\n\n' +
      S + ' id="backlog-script">' + SCRIPT_TEXT + SE + '\n' +
      '<!-- ===== Backlog app end ===== -->\n';
  }

  function buildHtml() {
    return '<!DOCTYPE html>\n<html lang="ja">\n<head>\n' +
      '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>' + esc(state.title) + '</title>\n' +
      '<style>html,body{margin:0;height:100%}</style>\n' +
      '</head>\n<body>\n' + buildFragment(true) + '</body>\n</html>\n';
  }

  function supportsFileSystem() {
    return typeof window.showSaveFilePicker === 'function' && window.isSecureContext;
  }

  function download(content, name, type) {
    var blob = new Blob([content], { type: type || 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name || currentFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function downloadHtml() {
    var name = currentFileName();
    download(buildHtml(), name);
    markSaved();
    toast('更新を反映した HTML をダウンロードしました: ' + name + (state.saveLocation ? ' → 保存先: ' + state.saveLocation : ''));
  }

  var handleStore = {
    key: 'handle:' + location.href.split('#')[0],
    open: function () {
      return new Promise(function (res, rej) {
        if (!window.indexedDB) return rej(new Error('no idb'));
        var r = indexedDB.open('backlog-html', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      });
    },
    get: function () {
      var k = this.key;
      return this.open().then(function (db) {
        return new Promise(function (res, rej) {
          var rq = db.transaction('kv').objectStore('kv').get(k);
          rq.onsuccess = function () { res(rq.result || null); };
          rq.onerror = function () { rej(rq.error); };
        });
      }).catch(function () { return null; });
    },
    set: function (v) {
      var k = this.key;
      return this.open().then(function (db) {
        return new Promise(function (res, rej) {
          var tx = db.transaction('kv', 'readwrite');
          tx.objectStore('kv').put(v, k);
          tx.oncomplete = function () { res(); };
          tx.onerror = function () { rej(tx.error); };
        });
      }).catch(function () {});
    }
  };

  var saving = false;
  function saveToFile(forcePicker) {
    if (saving) return;
    if (!supportsFileSystem()) { downloadHtml(); return; }
    saving = true;
    var html = buildHtml();
    var done = function () { saving = false; };

    var getHandle = function () {
      if (fileHandle && !forcePicker) return Promise.resolve(fileHandle);
      var restore = forcePicker ? Promise.resolve(null) : handleStore.get();
      return restore.then(function (h) {
        if (h && h.name === currentFileName()) {
          return h.requestPermission({ mode: 'readwrite' }).then(function (p) { return p === 'granted' ? h : null; }, function () { return null; });
        }
        return null;
      }).then(function (h) {
        if (h) return h;
        return window.showSaveFilePicker({
          suggestedName: currentFileName(),
          types: [{ description: 'HTML ファイル', accept: { 'text/html': ['.html', '.htm'] } }]
        });
      });
    };

    getHandle().then(function (h) {
      fileHandle = h;
      return h.createWritable().then(function (w) {
        return w.write(html).then(function () { return w.close(); });
      });
    }).then(function () {
      handleStore.set(fileHandle);
      markSaved();
      toast('保存しました: ' + fileHandle.name);
      done();
    }).catch(function (err) {
      done();
      if (err && err.name === 'AbortError') return;
      console.error(err);
      fileHandle = null;
      toast('直接保存に失敗したためダウンロードします: ' + (err && err.message ? err.message : err));
      download(html, currentFileName());
    });
  }

  // 主保存操作: ローカルファイルなら上書き、それ以外はダウンロード
  function primarySave() {
    if (supportsFileSystem() && location.protocol === 'file:') saveToFile(false);
    else downloadHtml();
  }

  // ---------------------------------------------------------------- toast
  var toastTimer = null;
  function toast(msg) {
    var el = $('.toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3600);
  }

  // ---------------------------------------------------------------- drag & drop
  function laneBodyOf(el) { return el && el.closest ? el.closest('[data-lane-body]') : null; }

  function placeholder() {
    var p = $('.placeholder');
    if (!p) { p = document.createElement('div'); p.className = 'placeholder'; }
    return p;
  }

  root.addEventListener('dragstart', function (e) {
    var card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    drag = { id: card.dataset.id };
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', card.dataset.id); } catch (err) {}
  });
  root.addEventListener('dragover', function (e) {
    if (!drag) return;
    var body = laneBodyOf(e.target);
    if (!body) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    var ph = placeholder();
    var cards = $$('.card:not(.dragging)', body);
    var before = null;
    for (var i = 0; i < cards.length; i++) {
      var r = cards[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { before = cards[i]; break; }
    }
    if (before) { if (ph.nextSibling !== before || ph.parentNode !== body) body.insertBefore(ph, before); }
    else if (ph.parentNode !== body || ph.nextSibling) body.appendChild(ph);
  });
  root.addEventListener('drop', function (e) {
    if (!drag) return;
    var body = laneBodyOf(e.target);
    if (!body) return;
    e.preventDefault();
    var ph = $('.placeholder');
    var afterId = null;
    if (ph && ph.parentNode === body) {
      var prev = ph.previousElementSibling;
      while (prev && (prev.classList.contains('dragging') || !prev.classList.contains('card'))) prev = prev.previousElementSibling;
      afterId = prev ? prev.dataset.id : null;
    }
    moveTask(drag.id, body.dataset.laneBody, afterId);
    drag = null;
  });
  root.addEventListener('dragend', function () {
    drag = null;
    var ph = $('.placeholder');
    if (ph) ph.remove();
    $$('.card.dragging').forEach(function (c) { c.classList.remove('dragging'); });
  });

  function moveTask(id, laneId, afterId) {
    var t = taskOf(id);
    if (!t) return;
    var others = state.tasks.filter(function (x) { return x.laneId === laneId && x.id !== id; })
      .sort(function (a, b) { return a.order - b.order; });
    var idx = 0;
    if (afterId) {
      var after = findById(others, afterId);
      idx = after ? others.indexOf(after) + 1 : others.length;
    }
    var before = snapshot(t);
    applyLaneChange(t, laneId);
    others.splice(idx, 0, t);
    others.forEach(function (x, i) { x.order = i; });
    recordDiff(t, before);
    commit();
  }

  // ---------------------------------------------------------------- global events
  root.addEventListener('click', function (e) {
    var el = e.target;
    if (el.closest('.settings-dialog')) { handleSettingsClick(e); return; }
    if (el.closest('.task-dialog')) return;
    if (el.closest('.changes-dialog')) {
      var cdlg = $('.changes-dialog');
      if (el.closest('[data-close]')) { cdlg.close(); return; }
      var cact = el.closest('[data-act]');
      if (!cact) return;
      if (cact.dataset.act === 'save-now') { cdlg.close(); primarySave(); }
      else if (cact.dataset.act === 'discard') {
        if (!confirm('未保存の変更をすべて破棄して、前回保存した状態に戻しますか？')) return;
        state = clone(savedState);
        colFilter = {}; hiddenCols = {}; activeViewId = '';
        cdlg.close();
        setDirty(false);
        renderHeader();
        renderMain();
        toast('変更を破棄しました');
      }
      return;
    }

    if (el.closest('.columns-dialog')) {
      var coldlg = $('.columns-dialog');
      if (el.closest('[data-close]')) { coldlg.close(); return; }
      if (el.closest('[data-act="cols-all"]')) { hiddenCols = {}; renderMain(); openColumnsDialog(); }
      return;
    }
    var vb = el.closest('[data-view]');
    if (vb) { view = vb.dataset.view; renderHeader(); renderMain(); return; }
    var tagAdd = el.closest('[data-tag-add]');
    if (tagAdd) {
      var tt = taskOf(tagAdd.dataset.tagAdd);
      if (!tt) return;
      var tname = prompt('追加するタグ名 (既存のタグ名なら選択、なければ新規作成)' + (state.tags.length ? '\n既存: ' + state.tags.map(function (x) { return x.name; }).join(', ') : ''), '');
      if (tname == null) return;
      var newTag = ensureTag(tname);
      if (!newTag) return;
      if (tt.tags.indexOf(newTag.id) < 0) {
        var tb = snapshot(tt);
        tt.tags.push(newTag.id);
        recordDiff(tt, tb);
      }
      setDirty(true);
      renderHeader();
      renderMain();
      return;
    }
    var tagRemove = el.closest('[data-tag-remove]');
    if (tagRemove) {
      var tr = taskOf(tagRemove.dataset.id);
      if (!tr) return;
      var tb2 = snapshot(tr);
      tr.tags = tr.tags.filter(function (id) { return id !== tagRemove.dataset.tagRemove; });
      recordDiff(tr, tb2);
      commit();
      return;
    }
    var act = el.closest('[data-act]');
    if (act) {
      var a = act.dataset.act;
      if (a === 'new') openTaskDialog(null);
      else if (a === 'settings') openSettings();
      else if (a === 'save') saveToFile(false);
      else if (a === 'download') downloadHtml();
      else if (a === 'changes') openChangesDialog();
      else if (a === 'clear-colfilter') { colFilter = {}; renderMain(); }
      else if (a === 'columns') openColumnsDialog();
      else if (a === 'view-save') saveView(null);
      else if (a === 'view-update') { if (activeView()) saveView(activeView()); }
      else if (a === 'view-rename') {
        var rv = activeView();
        if (!rv) return;
        var nn = prompt('ビュー名', rv.name);
        if (nn == null || !nn.trim()) return;
        rv.name = nn.trim();
        setDirty(true);
        renderMain();
      }
      else if (a === 'view-delete') {
        var dv = activeView();
        if (!dv) return;
        if (!confirm('ビュー「' + dv.name + '」を削除しますか？ (タスクは削除されません)')) return;
        state.views = state.views.filter(function (x) { return x.id !== dv.id; });
        activeViewId = '';
        setDirty(true);
        renderMain();
      }
      return;
    }
    var addLane = el.closest('[data-add-lane]');
    if (addLane) { openTaskDialog(null, addLane.dataset.addLane); return; }
    var card = el.closest('.card');
    if (card) { openTaskDialog(card.dataset.id); return; }
    var open = el.closest('[data-open]');
    if (open) { openTaskDialog(open.dataset.open); return; }
    var th = el.closest('th[data-sort]');
    if (th) {
      var key = th.dataset.sort;
      if (sort.key === key) sort.dir = -sort.dir; else { sort.key = key; sort.dir = 1; }
      renderMain();
    }
  });

  root.addEventListener('input', function (e) {
    var el = e.target;
    if (el.closest('.settings-dialog')) { handleSettingsInput(e); return; }
    if (el.closest('dialog')) return;
    if (el.dataset.filter === 'q') { filter.q = el.value; renderMain(); return; }
    if (el.dataset.colfilter && el.tagName !== 'SELECT') { colFilter[el.dataset.colfilter] = el.value; renderMain(); }
  });

  root.addEventListener('change', function (e) {
    var el = e.target;
    if (el.closest('.settings-dialog')) {
      if (el.dataset.action === 'import') { importFile(el.files[0]); el.value = ''; return; }
      if (el.hasAttribute('data-sel')) {
        var srow = el.closest('.master-row');
        if (srow) { if (el.checked) bulkSel[srow.dataset.id] = true; else delete bulkSel[srow.dataset.id]; }
        var n = state.members.filter(function (m) { return bulkSel[m.id]; }).length;
        var db = $('[data-bulk="delete"]', $('.settings-dialog'));
        if (db) { db.disabled = !n; db.textContent = '選択を削除 (' + n + ')'; }
        return;
      }
      if (el.type === 'checkbox' || el.type === 'color' || el.type === 'date' || el.tagName === 'SELECT') handleSettingsInput(e);
      return;
    }
    if (el.closest('.columns-dialog')) {
      if (el.dataset.col) { if (el.checked) delete hiddenCols[el.dataset.col]; else hiddenCols[el.dataset.col] = true; renderMain(); }
      return;
    }
    if (el.closest('dialog')) return;
    if (el.hasAttribute('data-saved-view')) { applyView(el.value ? findById(state.views, el.value) : null); return; }
    if (el.dataset.filter && el.dataset.filter !== 'q') { filter[el.dataset.filter] = el.value; renderMain(); return; }
    if (el.dataset.colfilter && el.tagName === 'SELECT') { colFilter[el.dataset.colfilter] = el.value; renderMain(); return; }
    var t = el.dataset.id ? taskOf(el.dataset.id) : null;
    if (!t) return;
    var before = snapshot(t);
    if (el.dataset.field) {
      var field = el.dataset.field;
      if (field === 'laneId') applyLaneChange(t, el.value);
      else t[field] = el.value;
    } else if (el.dataset.custom) {
      var f = fieldOf(el.dataset.custom);
      if (!f) return;
      var v = String(el.value || '').trim();
      if (f.type === 'date') v = normDate(v);
      if (v) t.custom[f.id] = v; else delete t.custom[f.id];
    } else return;
    recordDiff(t, before);
    commit();
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      if (!isStandalone && !root.contains(document.activeElement)) return;
      e.preventDefault();
      primarySave();
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  renderShell();
  if (supportsFileSystem()) {
    handleStore.get().then(function (h) {
      if (h && h.name === currentFileName()) fileHandle = h;
    });
  }
})();
</script>
<!-- ===== Backlog app end ===== -->
